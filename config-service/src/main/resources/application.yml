server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/dangersvn/config-repo.git
#          search-paths:
#            - config-repo # config-repository, this is a folder in our git repository
          default-label: core-services-v2
  security:
    user:
      name: configUser
      password: configPassword

eureka:
  client:
    serviceUrl:
      defaultZone: http://eurekaUser:eurekaPassword@localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"